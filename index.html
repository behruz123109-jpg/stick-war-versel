<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick War: Online</title>
    <style>
        body { 
            margin: 0; 
            background-color: #1a1a2e; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #ui-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            width: 800px; 
            padding: 15px; 
            background: #16213e; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stats {
            font-size: 18px;
        }
        .btn { 
            padding: 10px 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: 0.2s; 
            font-size: 14px;
        }
        .btn-spawn { background: #e94560; color: white; margin-left: 10px; }
        .btn-spawn:hover { background: #d93852; }
        .btn-ad { background: #f39c12; color: white; animation: pulse 2s infinite; }
        .btn-ad:hover { background: #e67e22; }
        
        /* O'yin maydoni dizayni */
        canvas { 
            background-color: #87CEEB; /* Osmon rangi */
            border: 4px solid #0f3460; 
            border-radius: 8px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- Yuqori panel (UI) -->
    <div id="ui-bar">
        <div class="stats">
            <span>O'yinchi: <b id="playerName" style="color: #4cd137;">Mehmon</b></span> | 
            <span>Olmos: <b id="gemCount" style="color: #00d2ff;">0</b> 💎</span>
        </div>
        <div>
            <button class="btn btn-ad" onclick="watchAd()">🎥 Reklama ko'rish (+10 💎)</button>
            <button class="btn btn-spawn" onclick="spawnUnit()">⚔️ Askar (100 Oltin)</button>
        </div>
    </div>

    <!-- O'yin chiziladigan maydon -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        // --- 1. SOZLAMALAR VA MULTIPLAYER ---
        
        // Vaqtincha tasodifiy ism beramiz (Keyinchalik Google Login ulanganda baza orqali olinadi)
        const username = "O'yinchi_" + Math.floor(Math.random() * 1000);
        document.getElementById("playerName").innerText = username;
        
        // =========================================================================
        // DIQQAT! O'ZINGNING RENDER MANZILINGNI SHU YERGA YOZ!
        // Masalan: "stick-war-backend-xyz.onrender.com"
        // Hech qanday "https://" yoki "wss://" yozma, faqat domenni o'zini yoz!
        // =========================================================================
        const RENDER_DOMAIN = "stick-war.onrender.com"; 
        
        // WebSocket orqali ulanish (wss:// bu xavfsiz ulanish, Vercel'da ishlaydi)
        const ws = new WebSocket(`wss://${RENDER_DOMAIN}/ws/Lobby-1`);
        
        let units = []; // Ekranga chiqadigan barcha askarlar ro'yxati

        ws.onopen = () => {
            console.log("Render serveriga muvaffaqiyatli ulandik!");
        };

        ws.onerror = (error) => {
            console.error("WebSocket xatoligi! Render server ishlayotganini tekshiring.", error);
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Serverdan askar chiqarish buyrug'i kelsa
            if (data.action === "spawn") {
                // Agar askar egasi men bo'lmasam, demak u dushman (isEnemy = true)
                const isEnemy = data.owner !== username;
                
                // Dushman o'ng tomondan (x=750), meniki chapdan (x=50) chiqadi
                const startX = isEnemy ? 750 : 50; 
                const unitColor = isEnemy ? "#e94560" : "#0f3460"; // Dushman qizil, meniki ko'k
                
                units.push({ 
                    x: startX, 
                    y: 300, 
                    color: unitColor, 
                    isEnemy: isEnemy 
                });
            }
        };

        function spawnUnit() {
            // Askar chiqarish tugmasi bosilganda serverga xabar jo'natamiz
            const unitData = { 
                action: "spawn", 
                owner: username
            };
            ws.send(JSON.stringify(unitData));
        }


        // --- 2. O'YIN DVIJOKI (Game Loop) ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function gameLoop() {
            // Ekranni har kadrda tozalash
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Yerni chizish (Jigarrang tuproq)
            ctx.fillStyle = "#8d6e63";
            ctx.fillRect(0, 340, canvas.width, 60);

            // Maysa qatlami (Yashil tepa qismi)
            ctx.fillStyle = "#4caf50";
            ctx.fillRect(0, 340, canvas.width, 10);

            // Askarlarni chizish va yurgizish
            units.forEach((unit) => {
                // Askarning o'zini chizish (to'rtburchak)
                ctx.fillStyle = unit.color;
                ctx.fillRect(unit.x, unit.y, 20, 40);
                
                // Qilichni chizish (oddiy chiziq)
                ctx.fillStyle = "silver";
                if(unit.isEnemy) {
                    ctx.fillRect(unit.x - 15, unit.y + 15, 20, 4); // Dushman qilichi chapga qaraydi
                    unit.x -= 1.5; // Dushman chapga yuradi
                } else {
                    ctx.fillRect(unit.x + 15, unit.y + 15, 20, 4); // Bizning qilich o'ngga qaraydi
                    unit.x += 1.5; // Bizning askar o'ngga yuradi
                }
            });

            // Animatsiyani to'xtovsiz davom ettirish
            requestAnimationFrame(gameLoop);
        }
        
        // O'yinni boshlash
        gameLoop();


        // --- 3. REKLAMA VA MONETIZATSIYA ---
        async function watchAd() {
            // Haqiqiy loyihada Yandex/Poki/CrazyGames reklamani chiqaruvchi maxsus kodi shu yerga tushadi
            alert("Reklama ko'rsatilmoqda... (Hozircha test rejimi)");
            
            // Reklama to'liq ko'rib bo'lingach, ekrandagi olmoslar soni oshadi
            let currentGems = parseInt(document.getElementById("gemCount").innerText);
            document.getElementById("gemCount").innerText = currentGems + 10;
            
            alert("Tabriklaymiz! Reklamani ko'rganingiz uchun +10 olmos berildi.");
        }
    </script>
</body>
</html>
