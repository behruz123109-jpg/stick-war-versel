<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick War: Online Strategy</title>
    <style>
        body { 
            margin: 0; background-color: #111; color: white; 
            font-family: Arial, sans-serif; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; 
        }
        #top-bar {
            display: flex; justify-content: space-between; width: 900px; 
            background: #222; padding: 10px 20px; border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #444;
        }
        .hud-item { font-size: 16px; font-weight: bold; }
        .gold { color: #f1c40f; }
        .gems { color: #3498db; }
        
        canvas { 
            background: linear-gradient(to bottom, #87CEEB 60%, #557a46 60%); 
            border: 4px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #controls {
            margin-top: 10px; display: flex; gap: 15px;
        }
        .game-btn {
            background: #e74c3c; color: white; border: none; padding: 10px 20px;
            font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer;
            transition: 0.2s;
        }
        .game-btn:hover { background: #c0392b; transform: scale(1.05); }
        .game-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="hud-item">Oltin: <span id="goldDisplay" class="gold">150</span> 🪙</div>
        <div class="hud-item">Baza Joji (HP): <span id="baseHp" style="color: #2ecc71;">100%</span> ❤️</div>
        <div class="hud-item">Olmos: <span id="gemDisplay" class="gems">0</span> 💎</div>
    </div>

    <canvas id="gameCanvas" width="900" height="450"></canvas>

    <div id="controls">
        <button class="game-btn" onclick="spawnUnit('miner')">⛏️ Konchi chiqar (خط 50 Oltin)</button>
        <button class="game-btn" onclick="spawnUnit('sword')">⚔️ Qilichboz (100 Oltin)</button>
        <button class="game-btn" onclick="watchAdForGold()">📺 Oltin olish (+100)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // O'yin iqtisodiyoti va holati
        let gold = 150;
        let gems = 0;
        let baseHealth = 100;

        // Askarlar va konchilar massivi
        let units = [];
        
        // Oltin koni koordinatalari (Xaritaning o'rtasida)
        const goldMine = { x: 450, y: 300, goldLeft: 5000 };

        // Askar qo'shish funksiyasi
        function spawnUnit(type) {
            let cost = type === 'miner' ? 50 : 100;
            if (gold >= cost) {
                gold -= cost;
                updateHUD();

                units.push({
                    type: type, // 'miner' yoki 'sword'
                    x: 80,      // Bizning bazadan chiqadi (chap tomon)
                    y: 310,
                    hp: 100,
                    targetX: type === 'miner' ? goldMine.x : 700, // Konchi konchiga, askar dushmanga boradi
                    state: 'moving' // 'moving', 'mining', 'fighting'
                });
            } else {
                alert("Oltin yetarli emas!");
            }
        }

        function updateHUD() {
            document.getElementById('goldDisplay').innerText = gold;
            document.getElementById('gemDisplay').innerText = gems;
        }

        function watchAdForGold() {
            alert("Reklama ko'rsatilmoqda...");
            gold += 100;
            updateHUD();
        }

        // Avtomatik har 2 sekundda passiv oltin qo'shilish (Konchilar ishlamasa ham)
        setInterval(() => {
            gold += 5;
            updateHUD();
        }, 2000);

        // --- O'YIN DVORI (GAME LOOP) ---
        function gameLoop() {
            // Ekranni tozalash
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Zamin va osmon
            ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, canvas.width, 270); // Osmon
            ctx.fillStyle = "#3d5535"; ctx.fillRect(0, 270, canvas.width, 180); // Tuproq/Maysa

            // 2. Bazalar (Chapda biznikilik, o'ngda dushman)
            // Bizning baza (Haykal/Qal'a)
            ctx.fillStyle = "#2980b9";
            ctx.fillRect(30, 180, 50, 110);
            ctx.fillStyle = "#fff"; ctx.font = "12px Arial"; ctx.fillText("Baza", 40, 175);

            // Dushman bazasi
            ctx.fillStyle = "#c0392b";
            ctx.fillRect(820, 180, 50, 110);
            ctx.fillText("Dushman", 825, 175);

            // 3. Oltin koni
            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(goldMine.x, goldMine.y, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText("Koni", goldMine.x - 12, goldMine.y + 4);

            // 4. Askarlarni boshqarish va chizish
            units.forEach((unit, index) => {
                // Harakat mantiqi
                if (unit.state === 'moving') {
                    if (unit.x < unit.targetX) unit.x += 1.5;
                    else if (unit.x > unit.targetX) unit.x -= 1.5;
                    else {
                        if (unit.type === 'miner') unit.state = 'mining';
                    }
                }

                // Konchi oltin yig'ishi
                if (unit.type === 'miner' && unit.state === 'mining') {
                    // Vaqti-vaqti bilan baza sari oltin tashiydi
                    if (Math.random() < 0.02) {
                        gold += 10;
                        updateHUD();
                    }
                }

                // Askarni chizish
                ctx.fillStyle = unit.type === 'miner' ? '#f1c40f' : '#e74c3c';
                ctx.fillRect(unit.x - 10, unit.y - 30, 16, 30); // Tanasi
                
                // Boshchasi
                ctx.beginPath();
                ctx.arc(unit.x - 2, unit.y - 35, 6, 0, Math.PI * 2);
                ctx.fillStyle = "#f5cd79";
                ctx.fill();
            });

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
