<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick War: Online 2P</title>
    <style>
        body {
            margin: 0; background: #0f1016; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        #ui-bar {
            display: flex; justify-content: space-between; width: 1100px;
            background: #1b1c29; padding: 12px 25px; border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #2d3047; font-size: 16px; font-weight: bold;
        }
        .gold { color: #f1c40f; }
        .statue-hp { color: #e74c3c; }
        canvas {
            background: linear-gradient(to bottom, #4a90e2 65%, #3b5323 65%);
            border: 4px solid #2d3047; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        #controls {
            margin-top: 12px; display: flex; gap: 12px; background: #1b1c29;
            padding: 12px 25px; border-radius: 0 0 8px 8px;
        }
        .game-btn {
            background: #e94560; color: white; border: none; padding: 10px 18px;
            font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .game-btn:hover { background: #d83a54; transform: translateY(-2px); }
        .game-btn:active { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div>Oltin: <span id="goldCount" class="gold">150</span> 🪙</div>
        <div>Sizning Haykalingiz HP: <span id="myStatueHp" class="statue-hp">100%</span> ❤️</div>
        <div>Dushman Haykali HP: <span id="enemyStatueHp" class="statue-hp">100%</span> ❤️</div>
    </div>

    <canvas id="gameCanvas" width="1100" height="480"></canvas>

    <div id="controls">
        <button class="game-btn" onclick="spawnUnit('miner')">⛏️ Konchi (50 🪙)</button>
        <button class="game-btn" onclick="spawnUnit('sword')">⚔️ Qilichboz (100 🪙)</button>
        <button class="game-btn" onclick="spawnUnit('arch')">🏹 O'qchi (120 🪙)</button>
        <button class="game-btn" style="background:#f39c12;" onclick="watchAd()">💎 Olmos olish</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Iqtisodiyot
        let gold = 150;
        let myStatueHp = 100;
        let enemyStatueHp = 100;

        // Oltin koni (Xarita o'rtasida)
        const goldMine = { x: 550, y: 350 };

        // Serverga ulanish (Render domeni)
        const RENDER_DOMAIN = "stick-war.onrender.com"; 
        const ws = new WebSocket(`wss://${RENDER_DOMAIN}/ws/Lobby-1`);

        let units = []; // Barcha askarlar va konchilar

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.action === "spawn") {
                // Dushman tomonidan kelgan askar
                units.push({
                    type: data.type,
                    x: 1020, // O'ng bazadan chiqadi
                    y: 360,
                    isEnemy: true,
                    hp: 100
                });
            }
        };

        function spawnUnit(type) {
            let cost = type === 'miner' ? 50 : (type === 'sword' ? 100 : 120);
            if (gold >= cost) {
                gold -= cost;
                document.getElementById('goldCount').innerText = gold;

                // O'zimizning askar
                units.push({
                    type: type,
                    x: 80, // Chap bazadan chiqadi
                    y: 360,
                    isEnemy: false,
                    hp: 100
                });

                // Serverga xabar beramiz
                ws.send(JSON.stringify({ action: "spawn", type: type }));
            } else {
                alert("Oltin yetarli emas!");
            }
        }

        function watchAd() {
            alert("Reklama ko'rsatildi! +100 Oltin qo'shildi.");
            gold += 100;
            document.getElementById('goldCount').innerText = gold;
        }

        // Passiv oltin (har 3 sekundda)
        setInterval(() => {
            gold += 10;
            document.getElementById('goldCount').innerText = gold;
        }, 3000);

        // --- O'YIN GRAFIkASI VA FIZIKASI (GAME LOOP) ---
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Bazalar (Chap va O'ng haykallar)
            // Chap baza (Bizning)
            ctx.fillStyle = "#2980b9";
            ctx.fillRect(40, 240, 45, 170);
            ctx.fillStyle = "#fff"; ctx.font = "11px Arial"; ctx.fillText("Sizning Baza", 30, 230);

            // O'ng baza (Dushman)
            ctx.fillStyle = "#c0392b";
            ctx.fillRect(1015, 240, 45, 170);
            ctx.fillText("Dushman Baza", 1000, 230);

            // 2. Oltin koni
            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(goldMine.x, goldMine.y - 20, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000"; ctx.font = "bold 12px Arial"; ctx.fillText("Koni", goldMine.x - 14, goldMine.y - 16);

            // 3. Askarlarni boshqarish va chizish
            units.forEach((unit, index) => {
                // Harakat va jang mantiqi
                if (!unit.isEnemy) {
                    // Bizning askarlar o'ngga yuradi
                    if (unit.type === 'miner' && unit.x < goldMine.x - 20) {
                        unit.x += 1.5; // Konchi konchiga boradi
                    } else if (unit.type !== 'miner' && unit.x < 980) {
                        unit.x += 1.5; // Askarlar dushmanga qarab yuradi
                    }
                } else {
                    // Dushman askarlari chapga yuradi
                    if (unit.x > 120) {
                        unit.x -= 1.5;
                    }
                }

                // --- STICKMAN (ODAMCHA) CHIZISH ---
                ctx.strokeStyle = unit.isEnemy ? "#e74c3c" : "#3498db";
                ctx.lineWidth = 3;

                // Bosh
                ctx.beginPath();
                ctx.arc(unit.x, unit.y - 30, 7, 0, Math.PI * 2);
                ctx.stroke();

                // Tana
                ctx.beginPath();
                ctx.moveTo(unit.x, unit.y - 23);
                ctx.lineTo(unit.x, unit.y - 8);
                ctx.stroke();

                // Oyoqlar
                ctx.beginPath();
                ctx.moveTo(unit.x, unit.y - 8);
                ctx.lineTo(unit.x - 6, unit.y);
                ctx.moveTo(unit.x, unit.y - 8);
                ctx.lineTo(unit.x + 6, unit.y);
                ctx.stroke();

                // Qurol yoki elementlar
                if (unit.type === 'sword') {
                    // Qilich
                    ctx.strokeStyle = "silver";
                    ctx.beginPath();
                    ctx.moveTo(unit.x + 5, unit.y - 18);
                    ctx.lineTo(unit.x + 15, unit.y - 18);
                    ctx.stroke();
                } else if (unit.type === 'arch') {
                    // Kamon
                    ctx.strokeStyle = "#8e44ad";
                    ctx.beginPath();
                    ctx.arc(unit.x + 8, unit.y - 18, 8, -Math.PI/2, Math.PI/2);
                    ctx.stroke();
                }
            });

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
